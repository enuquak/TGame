# Local development through the existing SSH tunnel. Selected explicitly by launchers.
# 测试环境保留所有日志；INFO 过滤 DEBUG，ERROR 只记录需要排查的问题。
minimumLogLevel: DEBUG
profileMongo: "127.0.0.1:37017"
profileRedis: "127.0.0.1:16379"
zooKeeper: "127.0.0.1:2181"
mongoDatabase: "tgame_test"
mongoUser: "tgame_test"
mongoPasswordVariable: "TGAME_MONGO_PASSWORD"
redisUser: "tgame_test"
redisPasswordVariable: "TGAME_REDIS_PASSWORD"
profileCachePrefix: "tgame:test:profile:"
discoveryRoot: "/tgame/test"
