# 本地环境参数；公共值由 server.yaml 的 meta 提供。
# 测试环境保留所有日志；INFO 过滤 DEBUG，ERROR 只记录需要排查的问题。
minimumLogLevel: DEBUG
profileMongo: "${meta.endpoints.mongo}"
profileRedis: "${meta.endpoints.redis}"
zooKeeper: "${meta.endpoints.zooKeeper}"
mongoDatabase: "${meta.storage.database}"
mongoUser: "${meta.storage.user}"
mongoPasswordVariable: "TGAME_MONGO_PASSWORD"
redisUser: "${meta.storage.user}"
redisPasswordVariable: "TGAME_REDIS_PASSWORD"
profileCachePrefix: "${meta.storage.profileCachePrefix}"
discoveryRoot: "${meta.paths.discoveryRoot}"
