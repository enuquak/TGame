syntax = "proto3";
import "google/protobuf/any.proto";
package tgame.transport;
option csharp_namespace = "TGame.Transport";

// Each pair of server processes shares one bidirectional stream.
message Frame {
  reserved 1, 2, 4, 5, 8;
  reserved "ping", "pong", "profile_request", "profile_reply", "single_point_id";

  oneof body {
    string hello = 3;     // 握手只交换进程实例名。
    RpcRequest request = 6;
    RpcReply reply = 7;
  }
}

message RpcRequest {
  reserved 3, 4, 5, 6;
  reserved "entity_id", "single_point_type", "source_process", "deadline_unix_ms";

  string request_id = 1;
  google.protobuf.Any payload = 2;
}

message RpcReply {
  string request_id = 1;
  google.protobuf.Any payload = 2;
  RpcError error = 3; // Exactly one of payload/error must be present.
}

message RpcError {
  int32 status_code = 1; // gRPC status code, excluding OK.
  string detail = 2;
}

service ServerLink {
  rpc Connect(stream Frame) returns (stream Frame);
}
