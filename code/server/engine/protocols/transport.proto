syntax = "proto3";
import "google/protobuf/any.proto";
package tgame.transport;
option csharp_namespace = "TGame.Transport";

// Each pair of server processes shares one bidirectional stream.
message Frame {
  oneof body {
    string hello = 1;     // 握手只交换进程实例名。
    RpcRequest request = 2;
    RpcReply reply = 3;
  }
}

message RpcRequest {
  string request_id = 1;
  google.protobuf.Any payload = 2;
}

message RpcReply {
  string request_id = 1;
  google.protobuf.Any payload = 2;
  RpcError error = 3; // Exactly one of payload/error must be present.
}

message RpcError {
  int32 status_code = 1; // gRPC status code, excluding OK.
  string detail = 2;
}

service ServerLink {
  rpc Connect(stream Frame) returns (stream Frame);
}
