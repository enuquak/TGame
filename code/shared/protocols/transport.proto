syntax = "proto3";
import "gm.proto";
import "profile.proto";
package tgame.transport;
option csharp_namespace = "TGame.Transport";

// Each pair of server processes shares one bidirectional stream.
message Frame {
  oneof body {
    bytes diagnostic_request = 1; // Optional diagnostic channel; disabled in normal runs.
    bytes diagnostic_reply = 2;
    string hello = 3;     // Establishes peer identity before requests.
    tgame.profile.ProfileRequest profile_request = 4;
    tgame.profile.ProfileReply profile_reply = 5;
    tgame.management.GmPingRequest gm_ping_request = 6;
    tgame.management.GmPingReply gm_ping_reply = 7;
  }
}
service ServerLink {
  rpc Connect(stream Frame) returns (stream Frame);
}
