syntax = "proto3";
import "google/protobuf/any.proto";
package tgame.transport;
option csharp_namespace = "TGame.Transport";

// Each pair of server processes shares one bidirectional stream.
message Frame {
  reserved 1, 2, 4, 5;
  reserved "ping", "pong", "profile_request", "profile_reply";

  oneof body {
    string hello = 3;     // Exchanges process roles before serving requests.
    RpcRequest request = 6;
    RpcReply reply = 7;
  }
}

message RpcRequest {
  string request_id = 1;
  google.protobuf.Any payload = 2;
}

message RpcReply {
  string request_id = 1;
  google.protobuf.Any payload = 2;
}

service ServerLink {
  rpc Connect(stream Frame) returns (stream Frame);
}
