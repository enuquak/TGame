syntax = "proto3";
import "profile.proto";
package tgame.smoke;
option csharp_namespace = "TGame.Diagnostics";

// Gate receives a binary Ping over WebSocket and returns a binary Pong.
message Ping {
  string request_id = 1;
  string entity_id = 2;
  string entry = 3;       // Login/Base or a Gate-local diagnostic request
  bool storage = 4;       // Base -> DBMgr dedicated link
  reserved 5, 6;
  tgame.profile.ProfileRequest profile_request = 7; // Supplied by the test client.
}
message Pong {
  string request_id = 1;
  string entity_id = 2;
  string responder = 3;
  tgame.profile.ProfileReply profile_reply = 4;
  enum Status { OK = 0; NOT_FOUND = 1; UNAVAILABLE = 2; }
  Status status = 5;
}
